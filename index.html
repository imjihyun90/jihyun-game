<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>지현이집</title>
<style>
  body { margin: 0; background: #1a1a1a; color: #eee; font-family: sans-serif; text-align: center; }
  canvas { width: 100%; max-width: 720px; image-rendering: pixelated; margin-top: 16px; cursor: pointer; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="320"></canvas>
<p>바닥을 클릭하면 걸어갑니다 · 밥솥에서 밥을 퍼서 시간 안에 지현이에게 밥을 주세요<br>
하드하드모드: 지현이1에게 밥 2·국 2, 지현이2에게 빵 3개! 음식 앞에 멈추면 집고, 손은 두 개예요</p>

<script>
// ===== 1. 캔버스 준비 =====
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const S = 4; // 도트 한 칸 크기

// ===== 2. 캐릭터 도트 그림 (글자 하나 = 색 하나, 점은 빈칸) =====
// 손님 (내가 조종하는 캐릭터, 여자, 단발머리)
const GUEST_BODY = [
  "..hhhh..",
  ".hhhhhh.",
  "hhsssshh",
  "hseesseh",
  "hssmmssh",
  "..ssss..",
  ".cccccc.",
  "sccccccs",
  "sccccccs",
  ".cccccc.",
];
// 지현이 (긴 머리, 빨간 옷)
const JIHYUN_BODY = [
  "..hhhh..",
  ".hhhhhh.",
  "hhsssshh",
  "hseesseh",
  "hssmmssh",
  "h.ssss.h",
  "hcccccch",
  "sccccccs",
  "sccccccs",
  ".cccccc.",
];
// 지현이가 밥 먹을 때 (입 벌림)
const JIHYUN_EAT = JIHYUN_BODY.slice();
JIHYUN_EAT[4] = "hssMMssh";

const LEGS = [
  [".pp..pp.", ".pp..pp."], // 서 있을 때
  ["..pp.pp.", ".pp...pp"], // 걸을 때
];
const GUEST  = { h: "#7a4a24", s: "#f2c9a0", e: "#222", c: "#f5c518", p: "#2d2d3a", m: "#e88" };
const JIHYUN = { h: "#2a1a12", s: "#f6d2b4", e: "#222", c: "#e0302f", p: "#2d2d3a", m: "#e88", M: "#822" };

function drawChar(x, y, body, pal, legFrame) {
  const rows = body.concat(LEGS[legFrame]);
  const ox = x - 16, oy = y - rows.length * S;
  rows.forEach((row, j) => {
    [...row].forEach((ch, i) => {
      if (ch === ".") return;
      ctx.fillStyle = pal[ch];
      ctx.fillRect(ox + i * S, oy + j * S, S, S);
    });
  });
}

// 밥공기
function drawBowl(x, y) {
  ctx.fillStyle = "#fff";    ctx.fillRect(x - 6, y - 12, 12, 3);  // 밥 윗부분
  ctx.fillRect(x - 8, y - 9, 16, 3);
  ctx.fillStyle = "#3a6ea5"; ctx.fillRect(x - 8, y - 6, 16, 4);  // 그릇
  ctx.fillRect(x - 6, y - 2, 12, 2);
}

// ===== 3. 게임 상태 =====
let me, jh, fed, over, win, winFrame, frame;
const GOAL = 3; // 이만큼 먹이면 성공
const COOKER = { x: 90, y: 215 };   // 밥솥 앞
const TABLE  = { x: 410, y: 225 };  // 식탁 앞

let mode = "hard"; // "hard" = 하드모드, "hh" = 하드하드모드

// ----- 하드하드모드 전용 -----
const STATIONS = [                    // 음식 집는 곳 (조리대 앞 바닥)
  { item: "rice",  x: 70,  y: 215 },  // 밥솥
  { item: "soup",  x: 150, y: 215 },  // 국 냄비
  { item: "bread", x: 220, y: 215 },  // 빵 바구니
];
const HH_TOTAL = 7;   // 밥2 + 국2 + 빵3
let jhs, overWho;

function reset() {
  me = { x: 240, y: 270, tx: 240, ty: 270, hand: false, step: 0, items: [], canPick: true };
  jh = { x: 410, y: 192, hungry: true, time: 1, eating: 0, wait: 0 };
  jhs = [
    { name: "지현이1", x: 330, y: 192, needs: { rice: 2, soup: 2 }, fed: 0, hungry: true, time: 1, eating: 0, wait: 0, done: false },
    { name: "지현이2", x: 430, y: 192, needs: { bread: 3 },         fed: 0, hungry: true, time: 1, eating: 0, wait: 0, done: false },
  ];
  fed = 0; over = false; win = false; winFrame = 0; frame = 0; overWho = "";
}

// ===== 4. 클릭(터치)하면 그곳으로 이동 =====
let scene = "title"; // "title" = 입장 화면, "play" = 게임 중
const ENTER_BTN = { x: 60,  y: 252, w: 170, h: 44 }; // 하드모드
const HH_BTN    = { x: 250, y: 252, w: 170, h: 44 }; // 하드하드모드
const inBtn = (b, x, y) => x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h;

cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * cv.width / r.width;
  const y = (e.clientY - r.top) * cv.height / r.height;

  // 입장 화면: <들어가기> 버튼을 누르면 게임 시작
  if (scene === "title") {
    if (inBtn(ENTER_BTN, x, y)) { mode = "hard"; reset(); scene = "play"; }
    if (inBtn(HH_BTN, x, y))    { mode = "hh";   reset(); scene = "play"; }
    return;
  }
  if (over) { reset(); return; }
  if (win) { if (winFrame > 60) scene = "title"; return; } // 성공 후 클릭 → 입장 화면으로
  me.tx = Math.max(20, Math.min(460, x));
  me.ty = Math.max(200, Math.min(305, y));
  me.canPick = true; // 새로 멈출 때마다 음식 하나 집을 수 있음
});

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ===== 5. 매 프레임 상태 계산 =====
function update() {
  if (win) { winFrame++; return; }
  if (over) return;
  frame++;
  if (mode === "hh") { updateHH(); return; }

  // 걷기
  const dx = me.tx - me.x, dy = me.ty - me.y, d = Math.hypot(dx, dy);
  if (d > 2) { me.x += dx / d * 3; me.y += dy / d * 3; me.step++; }
  else me.step = 0;

  // 밥솥에서 밥 푸기
  if (!me.hand && dist(me, COOKER) < 45) me.hand = true;

  // 지현이에게 밥 먹여주기
  if (me.hand && jh.hungry && dist(me, TABLE) < 70) {
    me.hand = false; jh.hungry = false; fed++;
    jh.eating = 60; jh.wait = 90;
    if (fed >= GOAL) { win = true; return; } // 3공기 다 먹이면 성공!
  }

  if (jh.eating > 0) jh.eating--;

  // 시간바 (먹일수록 빨리 줄어듦) — 다 떨어지면 실패
  if (jh.hungry) {
    jh.time -= 1 / Math.max(130, 300 - fed * 50);
    if (jh.time <= 0) { jh.time = 0; over = true; }
  } else if (--jh.wait <= 0) {
    jh.hungry = true; jh.time = 1;
  }
}

// ----- 하드하드모드 계산 -----
// 아직 누군가 필요로 하는데, 손에 안 든 음식 개수
function wanted(item) {
  let n = 0;
  jhs.forEach(j => n += j.needs[item] || 0);
  return n - me.items.filter(i => i === item).length;
}

function updateHH() {
  // 걷기 (하드모드와 같은 속도)
  const dx = me.tx - me.x, dy = me.ty - me.y, d = Math.hypot(dx, dy);
  if (d > 2) { me.x += dx / d * 3; me.y += dy / d * 3; me.step++; }
  else me.step = 0;

  // 음식 앞에 멈추면 하나 집기 (손은 2개, 필요 없는 음식은 안 집음)
  if (d <= 2 && me.canPick && me.items.length < 2) {
    for (const st of STATIONS) {
      if (dist(me, st) < 40 && wanted(st.item) > 0) {
        me.items.push(st.item); me.canPick = false; break;
      }
    }
  }

  // 지현이 근처에 가면 필요한 음식 자동으로 주기
  jhs.forEach(j => {
    if (j.done || dist(me, { x: j.x, y: 225 }) >= 60) return;
    const k = me.items.findIndex(i => (j.needs[i] || 0) > 0);
    if (k < 0) return;
    const item = me.items.splice(k, 1)[0];
    j.needs[item]--; j.fed++; fed++;
    j.eating = 60; j.hungry = false; j.wait = 90;
    if (Object.values(j.needs).every(n => n === 0)) j.done = true;
  });
  if (jhs.every(j => j.done)) { win = true; return; }

  // 시간바: 하드모드보다 아주 살짝(약 10%) 빠르게 줄어듦
  jhs.forEach(j => {
    if (j.eating > 0) j.eating--;
    if (j.done) return;
    if (j.hungry) {
      j.time -= 1 / Math.max(117, 270 - j.fed * 45);
      if (j.time <= 0) { j.time = 0; over = true; overWho = j.name; }
    } else if (--j.wait <= 0) {
      j.hungry = true; j.time = 1;
    }
  });
}

// ===== 6. 그리기 =====
// 국그릇
function drawSoup(x, y) {
  ctx.fillStyle = "#d9822b"; ctx.fillRect(x - 7, y - 10, 14, 3);  // 국물
  ctx.fillStyle = "#6b3e1f"; ctx.fillRect(x - 8, y - 7, 16, 5);   // 그릇
  ctx.fillRect(x - 6, y - 2, 12, 2);
}
// 빵
function drawBread(x, y) {
  ctx.fillStyle = "#e8b86a"; ctx.fillRect(x - 6, y - 12, 12, 3);
  ctx.fillStyle = "#d79a4a"; ctx.fillRect(x - 8, y - 9, 16, 8);
  ctx.fillStyle = "#a8692a"; ctx.fillRect(x - 4, y - 8, 2, 3); ctx.fillRect(x + 2, y - 8, 2, 3);
}
function drawItem(item, x, y) {
  if (item === "rice") drawBowl(x, y);
  else if (item === "soup") drawSoup(x, y);
  else drawBread(x, y);
}

// 하드하드모드 조리대: 밥솥 + 국 냄비 + 빵 바구니
function drawKitchenHH() {
  ctx.fillStyle = "#a07850"; ctx.fillRect(30, 128, 220, 10);
  ctx.fillStyle = "#7a5a3a"; ctx.fillRect(30, 138, 220, 50);
  ctx.fillStyle = "#eee";    ctx.fillRect(48, 98, 40, 30);   // 밥솥
  ctx.fillStyle = "#ccc";    ctx.fillRect(46, 94, 44, 8);
  ctx.fillStyle = "#e33";    ctx.fillRect(62, 110, 8, 5);
  ctx.fillStyle = "#777";    ctx.fillRect(132, 106, 36, 22); // 국 냄비
  ctx.fillStyle = "#555";    ctx.fillRect(128, 102, 44, 5);
  ctx.fillRect(124, 110, 6, 4); ctx.fillRect(170, 110, 6, 4);
  ctx.fillStyle = "#d9822b"; ctx.fillRect(132, 102, 36, 3);
  ctx.fillStyle = "#b07a3a"; ctx.fillRect(198, 114, 44, 14); // 빵 바구니
  ctx.fillStyle = "#8a5a2a"; for (let x = 202; x < 242; x += 8) ctx.fillRect(x, 116, 3, 12);
  drawBread(212, 118); drawBread(228, 118); drawBread(220, 112);
  if (frame % 40 < 20) {                                     // 김
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.fillRect(66, 84, 3, 6); ctx.fillRect(70, 78, 3, 6);
    ctx.fillRect(146, 90, 3, 6); ctx.fillRect(152, 84, 3, 6);
  }
  ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("밥", 70, 166); ctx.fillText("국", 150, 166); ctx.fillText("빵", 220, 166);
}

// 하드하드모드 식탁 + 지현이 2명
function drawTableHH() {
  jhs.forEach(j => {
    const chewing = j.eating > 0 && Math.floor(j.eating / 8) % 2 === 0;
    drawChar(j.x, j.y, chewing ? JIHYUN_EAT : JIHYUN_BODY, JIHYUN, 0);
    ctx.fillStyle = "#6a4a2a"; ctx.fillRect(j.x - 22, j.y - 30, 4, 34);
    ctx.fillRect(j.x + 18, j.y - 30, 4, 34);
  });
  ctx.fillStyle = "#b08a5a"; ctx.fillRect(290, 180, 180, 10);
  ctx.fillStyle = "#8a6a40"; ctx.fillRect(290, 190, 180, 6);
  ctx.fillRect(296, 196, 6, 26); ctx.fillRect(458, 196, 6, 26);
  ctx.fillStyle = "#ccc";
  jhs.forEach(j => { ctx.fillRect(j.x + 28, 182, 2, 7); ctx.fillRect(j.x + 32, 182, 2, 7); });
}

// 하드하드모드 말풍선(남은 주문) + 시간바 + 이름
function drawBubblesHH() {
  jhs.forEach(j => {
    ctx.fillStyle = "#4a3a2c"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(j.name, j.x, j.y - 100);
    if (j.done) {
      ctx.fillStyle = "#c0392b"; ctx.font = "bold 13px sans-serif";
      ctx.fillText(j.eating > 0 ? "아 마싯당" : "배불러~", j.x, j.y - 62);
      return;
    }
    if (j.hungry) {
      const list = [];
      for (const k in j.needs) for (let n = 0; n < j.needs[k]; n++) list.push(k);
      const w = list.length * 16 + 6;
      ctx.fillStyle = "#fff"; ctx.fillRect(j.x - w / 2, j.y - 82, w, 26);
      ctx.fillRect(j.x - 4, j.y - 56, 8, 6);
      list.forEach((it, i) => drawItem(it, j.x - w / 2 + 11 + i * 16, j.y - 60));
      ctx.fillStyle = "#333"; ctx.fillRect(j.x - 30, j.y - 96, 60, 6);
      ctx.fillStyle = j.time > 0.3 ? "#5c5" : "#e44";
      ctx.fillRect(j.x - 30, j.y - 96, 60 * j.time, 6);
    }
    if (j.eating > 0) {
      ctx.fillStyle = "#c0392b"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("아 마싯당", j.x, j.y - 62);
    }
  });
}

function drawTableScene() {
  // 지현이 (앉아 있어서 다리는 식탁에 가려짐)
  const chewing = jh.eating > 0 && Math.floor(jh.eating / 8) % 2 === 0;
  drawChar(jh.x, jh.y, chewing ? JIHYUN_EAT : JIHYUN_BODY, JIHYUN, 0);
  // 의자 등받이
  ctx.fillStyle = "#6a4a2a"; ctx.fillRect(jh.x - 22, jh.y - 30, 4, 34);
  ctx.fillRect(jh.x + 18, jh.y - 30, 4, 34);
  // 식탁
  ctx.fillStyle = "#b08a5a"; ctx.fillRect(360, 180, 100, 10);
  ctx.fillStyle = "#8a6a40"; ctx.fillRect(360, 190, 100, 6);
  ctx.fillRect(366, 196, 6, 26); ctx.fillRect(448, 196, 6, 26);
  // 수저
  ctx.fillStyle = "#ccc"; ctx.fillRect(438, 182, 2, 7); ctx.fillRect(442, 182, 2, 7);
}

function draw() {
  // 벽
  ctx.fillStyle = "#fbf3e4"; ctx.fillRect(0, 0, 480, 140);
  ctx.fillStyle = "#f2e2c4";                                 // 벽지 줄무늬
  for (let x = 0; x < 480; x += 24) ctx.fillRect(x, 0, 10, 130);
  ctx.fillStyle = "#d9c3a0"; ctx.fillRect(0, 130, 480, 10);  // 걸레받이
  // 창문
  ctx.fillStyle = "#a8d8f0"; ctx.fillRect(300, 30, 120, 70);
  ctx.fillStyle = "#fff";    ctx.fillRect(296, 26, 128, 4); ctx.fillRect(296, 100, 128, 4);
  ctx.fillRect(357, 30, 6, 70);
  // 간판
  ctx.fillStyle = "#c9a227"; ctx.fillRect(170, 30, 100, 34);
  ctx.fillStyle = "#3b2a1a"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("지현이집", 220, 54);
  // 바닥 타일
  for (let y = 140; y < 320; y += 20)
    for (let x = 0; x < 480; x += 20) {
      ctx.fillStyle = (x + y) % 40 === 0 ? "#c8eaa0" : "#bce293";
      ctx.fillRect(x, y, 20, 20);
    }
  if (mode === "hh") { drawPlayHH(); return; }
  // 조리대 + 밥솥
  ctx.fillStyle = "#a07850"; ctx.fillRect(30, 128, 120, 10);
  ctx.fillStyle = "#7a5a3a"; ctx.fillRect(30, 138, 120, 50);
  ctx.fillStyle = "#eee";    ctx.fillRect(48, 98, 40, 30);   // 밥솥 몸통
  ctx.fillStyle = "#ccc";    ctx.fillRect(46, 94, 44, 8);    // 뚜껑
  ctx.fillStyle = "#e33";    ctx.fillRect(62, 110, 8, 5);    // 버튼
  if (frame % 40 < 20) {                                     // 김
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.fillRect(66, 84, 3, 6); ctx.fillRect(70, 78, 3, 6);
  }
  drawBowl(115, 128); drawBowl(135, 128);

  // 캐릭터 (아래쪽에 있는 쪽을 나중에 그려서 앞에 보이게)
  const walking = me.step ? Math.floor(me.step / 8) % 2 : 0;
  const list = [
    { y: 222,  fn: drawTableScene },
    { y: me.y, fn: () => drawChar(me.x, me.y, GUEST_BODY, GUEST, walking) },
  ].sort((a, b) => a.y - b.y);
  list.forEach(o => o.fn());

  // 들고 있는 밥
  if (me.hand) drawBowl(me.x, me.y - 50);

  // 지현이 말풍선 + 시간바
  if (jh.hungry) {
    ctx.fillStyle = "#fff"; ctx.fillRect(jh.x - 18, jh.y - 82, 36, 26);
    ctx.fillRect(jh.x - 4, jh.y - 56, 8, 6);
    drawBowl(jh.x, jh.y - 62);
    ctx.fillStyle = "#333"; ctx.fillRect(jh.x - 30, jh.y - 96, 60, 6);
    ctx.fillStyle = jh.time > 0.3 ? "#5c5" : "#e44";
    ctx.fillRect(jh.x - 30, jh.y - 96, 60 * jh.time, 6);
  }
  if (jh.eating > 0) {
    ctx.fillStyle = "#c0392b"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("아 마싯당", jh.x, jh.y - 62);
  }

  // 점수판
  ctx.textAlign = "left"; ctx.fillStyle = "#4a3a2c"; ctx.font = "bold 16px sans-serif";
  ctx.fillText("먹인 밥: " + fed + " / " + GOAL + "공기", 12, 22);

  // 성공 화면
  if (win) drawWin();

  // 실패
  if (over) {
    ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, 0, 480, 320);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.font = "bold 26px sans-serif"; ctx.fillText("지현이가 배고파서 굶어죽었어요", 240, 150);
    ctx.font = "16px sans-serif";
    ctx.fillText("밥 " + fed + "공기 · 클릭하면 다시 시작", 240, 182);
  }
}

// 하드하드모드 화면 (벽·바닥은 draw()에서 이미 그림)
function drawPlayHH() {
  drawKitchenHH();
  const walking = me.step ? Math.floor(me.step / 8) % 2 : 0;
  const list = [
    { y: 222,  fn: drawTableHH },
    { y: me.y, fn: () => drawChar(me.x, me.y, GUEST_BODY, GUEST, walking) },
  ].sort((a, b) => a.y - b.y);
  list.forEach(o => o.fn());
  // 양손에 든 음식
  if (me.items[0]) drawItem(me.items[0], me.x - 10, me.y - 50);
  if (me.items[1]) drawItem(me.items[1], me.x + 10, me.y - 50);
  drawBubblesHH();

  ctx.textAlign = "left"; ctx.fillStyle = "#4a3a2c"; ctx.font = "bold 16px sans-serif";
  ctx.fillText("배달: " + fed + " / " + HH_TOTAL, 12, 22);

  if (win) drawWin();
  if (over) {
    ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, 0, 480, 320);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center";
    ctx.font = "bold 24px sans-serif"; ctx.fillText(overWho + "가 배고파서 굶어죽었어요", 240, 150);
    ctx.font = "16px sans-serif";
    ctx.fillText("배달 " + fed + "개 · 클릭하면 다시 시작", 240, 182);
  }
}

// ===== 성공 화면: 지현이가 1억 포상 =====
function drawWin() {
  const t = winFrame;
  // 금빛 배경
  ctx.fillStyle = "rgba(255, 236, 160, 0.95)"; ctx.fillRect(0, 0, 480, 320);
  // 빛줄기
  ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6 + t / 60;
    ctx.save(); ctx.translate(240, 175); ctx.rotate(a);
    ctx.fillRect(0, -6, 300, 12); ctx.restore();
  }
  // 떨어지는 지폐
  for (let i = 0; i < 18; i++) {
    const x = (i * 53 + Math.sin(t / 20 + i) * 12) % 480;
    const y = (t * (1.5 + (i % 4) * 0.5) + i * 37) % 360 - 30;
    ctx.fillStyle = "#3f9b4a"; ctx.fillRect(x, y, 22, 11);
    ctx.fillStyle = "#a6e3a1"; ctx.fillRect(x + 8, y + 3, 6, 5);
  }
  // 지현이 (2배 크기, 통통 튀기)
  const bounce = Math.abs(Math.sin(t / 10)) * 8;
  const hh = mode === "hh";
  (hh ? [170, 250] : [240]).forEach((cx, i) => {
    const b = i ? Math.abs(Math.cos(t / 10)) * 8 : bounce;
    ctx.save(); ctx.translate(cx, 230 - b); ctx.scale(2, 2);
    drawChar(0, 0, JIHYUN_BODY, JIHYUN, 0);
    ctx.restore();
  });
  // 돈가방
  const bx = hh ? 310 : 280;
  ctx.fillStyle = "#b8862d"; ctx.fillRect(bx, 196, 40, 34);
  ctx.fillStyle = "#8a6420"; ctx.fillRect(bx + 12, 188, 16, 8);
  ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("₩", bx + 20, 220);
  // 글자
  ctx.fillStyle = "#c0392b"; ctx.font = "bold 34px sans-serif";
  ctx.fillText("성공!", 240, 50);
  ctx.fillStyle = "#4a3a2c"; ctx.font = "bold 18px sans-serif";
  ctx.fillText(hh ? "지현이들이 둘 다 100kg를 달성했어요" : "지현이가 100kg를 달성했어요", 240, 80);
  ctx.fillStyle = "#c0392b"; ctx.font = "bold 24px sans-serif";
  ctx.fillText(hh ? "포상금 2억 원 획득!" : "포상금 1억 원 획득!", 240, 275);
  if (t > 60 && t % 60 < 40) {
    ctx.fillStyle = "#4a3a2c"; ctx.font = "14px sans-serif";
    ctx.fillText("클릭하면 처음으로", 240, 302);
  }
}

// ===== 7. 입장 화면 =====
let titleFrame = 0;
function drawTitle() {
  titleFrame++;
  // 하늘
  ctx.fillStyle = "#bfe6ff"; ctx.fillRect(0, 0, 480, 320);
  // 구름
  ctx.fillStyle = "#fff";
  const cx = (titleFrame * 0.3) % 560 - 80;
  ctx.fillRect(cx, 40, 60, 14); ctx.fillRect(cx + 12, 30, 36, 12);
  ctx.fillRect((cx + 280) % 560 - 80, 70, 50, 12);
  // 잔디
  ctx.fillStyle = "#9fd97a"; ctx.fillRect(0, 230, 480, 90);
  // 집
  ctx.fillStyle = "#fbf3e4"; ctx.fillRect(140, 110, 200, 125);
  ctx.fillStyle = "#e0302f";                                     // 지붕
  for (let i = 0; i < 50; i += 4) ctx.fillRect(130 + i, 110 - i, 220 - i * 2, 4);
  ctx.fillStyle = "#a07850"; ctx.fillRect(220, 165, 40, 70);     // 문
  ctx.fillStyle = "#f5c518"; ctx.fillRect(250, 198, 4, 4);       // 문고리
  ctx.fillStyle = "#a8d8f0"; ctx.fillRect(160, 160, 40, 34); ctx.fillRect(280, 160, 40, 34); // 창문
  ctx.fillStyle = "#fff";    ctx.fillRect(178, 160, 4, 34);  ctx.fillRect(298, 160, 4, 34);
  // 간판
  ctx.fillStyle = "#c9a227"; ctx.fillRect(190, 122, 100, 30);
  ctx.fillStyle = "#3b2a1a"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("제이빌리지304호", 240, 143);
  // 지현이와 손님이 문 옆에 서 있음
  drawChar(110, 240, JIHYUN_BODY, JIHYUN, 0);
  drawChar(370, 240, GUEST_BODY, GUEST, Math.floor(titleFrame / 20) % 2);
  // 제목
  ctx.fillStyle = "#4a3a2c"; ctx.font = "bold 30px sans-serif";
  ctx.fillText("지현이와 밥먹기", 240, 46);
  // <들어가기> 버튼 2개 (살짝 깜빡임)
  const blink = titleFrame % 60 < 30;
  const btn = (b, shadow, c1, c2, label) => {
    ctx.fillStyle = shadow; ctx.fillRect(b.x, b.y + 4, b.w, b.h);
    ctx.fillStyle = blink ? c1 : c2; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(label, b.x + b.w / 2, b.y + 28);
  };
  btn(ENTER_BTN, "#c0392b", "#e0302f", "#ef4a3f", "들어가기<하드모드>");
  btn(HH_BTN,    "#4a1a8a", "#6c2bd9", "#8e44ad", "들어가기<하드하드모드>");
}

// ===== 8. 게임 루프 =====
function loop() {
  if (scene === "title") drawTitle();
  else { update(); draw(); }
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
